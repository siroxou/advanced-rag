name: advanced-rag

# Lean local infra. Gemma 4 runs on the host via Ollama (Apple Metal), NOT in a
# container - Docker on macOS has no GPU passthrough.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: advanced-rag-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the non-superuser app role `rag` and its database on first init,
      # so Row-Level Security is actually enforced. Only runs against an empty
      # data dir: a volume created before this change must be recreated
      # (`docker compose down -v && make up`).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
